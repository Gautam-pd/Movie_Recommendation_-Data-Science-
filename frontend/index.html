      // ----------------------------------------------------
      // API Clients
      // ----------------------------------------------------
      const api = {
        async getGenres() {
          const res = await fetch("/api/genres");
          if (!res.ok) throw new Error("Failed to fetch genres");
          return res.json();
        },
        async getRecommendations(payload) {
          const res = await fetch("/api/recommendations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error("Failed to fetch recommendations");
          return res.json();
        },
        async getInsights() {
          const res = await fetch("/api/insights");
          if (!res.ok) throw new Error("Failed to fetch insights");
          return res.json();
        }
      };

      // ----------------------------------------------------
      // Component: GenreQuiz
      // ----------------------------------------------------
      function GenreQuiz({ onSubmit, isLoading }) {
        const [availableGenres, setAvailableGenres] = React.useState([]);
        const [selectedGenres, setSelectedGenres] = React.useState([]);
        const [mood, setMood] = React.useState("Thought-provoking");
        const [era, setEra] = React.useState("Any");
        const [sliderVal, setSliderVal] = React.useState(50);
        const [error, setError] = React.useState("");
        const [loadingGenres, setLoadingGenres] = React.useState(true);

        React.useEffect(() => {
          api.getGenres()
            .then(data => {
              setAvailableGenres(data.genres);
              setLoadingGenres(false);
            })
            .catch(err => {
              console.error(err);
              setError("Could not connect to backend server. Make sure FastAPI server is running.");
              setLoadingGenres(false);
            });
        }, []);

        const handleGenreToggle = (genre) => {
          setError("");
          if (selectedGenres.includes(genre)) {
            setSelectedGenres(selectedGenres.filter(g => g !== genre));
          } else {
            if (selectedGenres.length >= 5) {
              setError("You can select up to 5 genres.");
              return;
            }
            setSelectedGenres([...selectedGenres, genre]);
          }
        };

        const getPercentileUsed = (val) => Math.round(30 + val * 0.6);

        const getSliderExplanation = (val) => {
          const pct = getPercentileUsed(val);
          if (val < 25) {
            return `Hidden Gems Mode: Will search for lesser-known, highly rated movies (vote counts above the ${pct}th percentile of the catalog).`;
          }
          if (val > 75) {
            return `Crowd Favorites Mode: Will strictly recommend popular hits with substantial ratings (vote counts above the ${pct}th percentile of the catalog).`;
          }
          return `Balanced Mode: Blends popular blockbusters and niche releases (vote counts above the ${pct}th percentile).`;
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          if (selectedGenres.length < 2) {
            setError("Please select at least 2 primary genres (up to 5).");
            return;
          }
          onSubmit({
            genres: selectedGenres,
            mood,
            era,
            gem_slider: Number(sliderVal)
          });
        };

        if (loadingGenres) {
          return (
            <div className="flex flex-col items-center justify-center py-20">
              <RefreshCwIcon className="animate-spin text-[#77c940] w-12 h-12 mb-4" />
              <p className="text-[#778d7e] text-lg">Loading available genres...</p>
            </div>
          );
        }

        return (
          <form onSubmit={handleSubmit} className="max-w-4xl mx-auto space-y-10 py-6">
            <div className="text-center space-y-4">
              <div className="inline-flex items-center px-3 py-1 rounded-full bg-[#061205] border border-[#142f0c] text-[#8ea894] text-xs font-medium tracking-wider uppercase">
                Recommendation Profiler
              </div>
              <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-white">
                Personalize Your Recommendations
              </h2>
              <p className="text-[#778d7e] max-w-xl mx-auto text-base">
                Tell us what you like and we'll find movies you'll love.
              </p>

      // ----------------------------------------------------
      // Component: ScoreBreakdown
      // ----------------------------------------------------
      function ScoreBreakdown({ movie, C_used, m_param_used }) {
        const simContribution = movie.genre_similarity * 0.6;
        const qualContribution = movie.quality_score * 0.4;
        
        return (
          <div className="bg-[#050b05] border border-[#193d05] p-4 sm:p-5 rounded-2xl space-y-4 text-xs font-mono mt-3">
            <div className="flex items-center gap-1.5 text-[#77c940] font-bold border-b border-[#081802] pb-2">
              <InfoIcon /> Recommendation Math Breakdown
            </div>
            
            <div className="bg-black p-3 rounded-xl border border-[#193d05] space-y-1">
              <div className="text-[#778d7e] font-semibold">Blended Score Formula:</div>
              <div className="text-[#cdffb8] overflow-x-auto whitespace-nowrap">
                Score = (0.6 × GenreSimilarity) + (0.4 × QualityScore)
              </div>
              <div className="text-[#778d7e] mt-2 font-semibold">Your Movie Calculation:</div>
              <div className="text-[#cdffb8] font-bold overflow-x-auto whitespace-nowrap">
                {movie.final_score.toFixed(4)} = (0.6 × {movie.genre_similarity.toFixed(4)}) + (0.4 × {movie.quality_score.toFixed(4)})
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-[#cdffb8]">1. Genre Similarity (60% Weight)</span>
                  <span className="text-[#77c940] font-bold">{(simContribution).toFixed(4)}</span>
                </div>
                <div className="space-y-1 text-[11px] text-[#778d7e]">
                  <p>• Cosine similarity between your vector & movie vector: <strong className="text-[#cdffb8]">{movie.genre_similarity.toFixed(4)}</strong></p>
                  <p>• Matches: <strong className="text-[#a5d98d]">[{movie.matched_genres.join(", ") || "None"}]</strong></p>
                  <p>• Math: <code className="bg-black px-1 rounded text-[#cdffb8]">cos(θ) = (A • B) / (||A|| ||B||)</code></p>
                </div>
                <div className="w-full bg-black rounded-full h-1.5 overflow-hidden border border-[#193d05]">
                  <div 
                    className="bg-[#2f751a] h-full rounded-full" 
                    style={{ width: `${movie.genre_similarity * 100}%` }}
                  />
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-[#cdffb8]">2. Quality Score (40% Weight)</span>
                  <span className="text-[#a5d98d] font-bold">{(qualContribution).toFixed(4)}</span>
                </div>
                <div className="space-y-1 text-[11px] text-[#778d7e]">
                  <p>• Precomputed global mean (C): <strong className="text-[#cdffb8]">{C_used.toFixed(4)}</strong></p>
                  <p>• Vote count requirement (m): <strong className="text-[#cdffb8]">{m_param_used.toFixed(1)}</strong> ratings</p>
                  <p>• Movie ratings: <strong className="text-[#cdffb8]">{movie.vote_count}</strong> votes | Avg: <strong className="text-[#cdffb8]">{movie.avg_rating.toFixed(2)}</strong></p>
                  <p>• Weighted Rating (WR) calculated: <strong className="text-[#cdffb8]">{movie.weighted_rating.toFixed(4)}</strong></p>
                  <p>• Min-Max normalisation: <strong className="text-[#a5d98d]">{movie.quality_score.toFixed(4)}</strong></p>
                </div>
                <div className="w-full bg-black rounded-full h-1.5 overflow-hidden border border-[#193d05]">
                  <div 
                    className="bg-[#246313] h-full rounded-full" 
                    style={{ width: `${movie.quality_score * 100}%` }}
                  />
                </div>
              </div>
            </div>

            <div className="bg-black p-3 rounded-xl border border-[#193d05] text-[10px] text-[#778d7e] space-y-1">
              <div className="font-bold text-[#cdffb8]">Bayesian Weighted Rating (IMDB Formula):</div>
              <code className="block text-[#cdffb8] py-1 overflow-x-auto whitespace-nowrap">
                WR = [v / (v + m)] × R + [m / (v + m)] × C
              </code>
              <div className="pt-1">
                WR = [{movie.vote_count} / ({movie.vote_count} + {m_param_used})] × {movie.avg_rating} + [{m_param_used} / ({movie.vote_count} + {m_param_used})] × {C_used.toFixed(4)} = <strong className="text-[#a5d98d]">{movie.weighted_rating.toFixed(4)}</strong>
              </div>
            </div>
          </div>
        );
      }

        const [insights, setInsights] = React.useState(null);

        const [error, setError] = React.useState("");

        React.useEffect(() => {
          api.getInsights()
            .then(data => {
              setInsights(data);
              setIsLoading(false);
            })
            .catch(err => {
              console.error(err);
              setError("Could not load insights. Ensure eda.py has been run to generate statistics.");
              setIsLoading(false);
            });
        }, []);

        if (isLoading) {
          return (
            <div className="flex flex-col items-center justify-center py-20">
              <RefreshCwIcon className="animate-spin text-indigo-500 w-12 h-12 mb-4" />
              <p className="text-slate-400">Loading dataset distribution statistics...</p>
            </div>
          );
        }

        if (error || !insights) {
          return (
            <div className="glass-panel p-6 rounded-2xl border-red-500/30 text-center max-w-xl mx-auto my-10 space-y-4">
              <p className="text-red-400">{error || "Insights dashboard unavailable."}</p>
              <p className="text-xs text-slate-400">
                Make sure to run <code className="bg-slate-950 px-1 rounded text-red-300">python -m backend.analysis.eda</code> on the server.
              </p>
            </div>
          );
        }

        const genreChartData = Object.entries(insights.genre_counts)
          .map(([genre, count]) => ({ genre, count }))
          .slice(0, 10);

        const ratingChartData = insights.rating_histogram.bins.map((bin, index) => ({
          rating: bin.toFixed(1),
          count: insights.rating_histogram.counts[index]
        }));

        const recommendedIds = new Set(
          recommendations ? recommendations.results.map(r => r.movieId) : []
        );

        const catalogScatter = insights.vote_vs_rating_sample
          .filter(item => !recommendedIds.has(item.movieId))
          .map(item => ({
            ...item,
            type: "Catalog Movie",
            size: 4
          }));

        const recommendedScatter = recommendations
          ? recommendations.results.map(movie => ({
              movieId: movie.movieId,
              title: movie.title,
              vote_count: movie.vote_count,
              avg_rating: movie.avg_rating,
              type: "Recommended Movie",
              size: 15
            }))
          : [];

        const CustomScatterTooltip = ({ active, payload }) => {
          if (active && payload && payload.length) {
            const data = payload[0].payload;
            return (
              <div className="bg-[#050b05] border border-[#193d05] p-3 rounded-xl font-mono text-xs shadow-2xl">
                <p className="font-bold text-[#cdffb8]">{data.title}</p>
                <p className="text-[#778d7e] mt-1">Avg Rating: <span className="text-[#cdffb8]">{data.avg_rating.toFixed(2)}</span></p>

          return null;
        };

        return (
          <div className="space-y-8 py-6">
            <div className="border-b border-[#081802] pb-4">
              <h2 className="text-2xl font-extrabold text-[#cdffb8] flex items-center gap-2">
                <BarChart3Icon className="text-[#77c940] w-6 h-6" /> Dataset Insights & Math Parameters

            {/* Stats Row */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="glass-panel p-5 rounded-2xl flex items-center gap-4 bg-[#050b05] border border-[#081802]">
                <div className="p-3 bg-[#0e240a] border border-[#1c4514] text-[#a5d98d] rounded-2xl">
                  <DatabaseIcon />
                </div>
                <div>
                  <p className="text-xs text-[#778d7e] font-semibold uppercase tracking-wider">Catalog Movies</p>
                  <p className="text-2xl font-black text-white">

                </div>
              </div>

              <div className="glass-panel p-5 rounded-2xl flex items-center gap-4 bg-[#050b05] border border-[#081802]">
                <div className="p-3 bg-[#0e240a] border border-[#1c4514] text-[#a5d98d] rounded-2xl">
                  <BarChart3Icon className="text-[#a5d98d]" />
                </div>
                <div>
                  <p className="text-xs text-[#778d7e] font-semibold uppercase tracking-wider">Total Ratings</p>
                  <p className="text-2xl font-black text-white">
                    {insights.dataset_summary.num_ratings.toLocaleString()}
                  </p>
                </div>
              </div>

              <div className="glass-panel p-5 rounded-2xl flex items-center gap-4 bg-[#050b05] border border-[#081802]">
                <div className="p-3 bg-[#0e240a] border border-[#1c4514] text-[#a5d98d] rounded-2xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div>
                  <p className="text-xs text-[#778d7e] font-semibold uppercase tracking-wider">Unique Reviewers</p>
                  <p className="text-2xl font-black text-white">
                    {insights.dataset_summary.num_users.toLocaleString()}
                  </p>
                </div>
              </div>

              <div className="glass-panel p-5 rounded-2xl flex items-center gap-4 bg-[#050b05] border border-[#081802]">
                <div className="p-3 bg-[#0e240a] border border-[#1c4514] text-[#a5d98d] rounded-2xl">
                  <HelpCircle className="w-6 h-6 text-[#a5d98d]" />
                </div>
                <div>
                  <p className="text-xs text-[#778d7e] font-semibold uppercase tracking-wider">Global Average C</p>
                  <p className="text-2xl font-black text-white">
                    {insights.C_global_mean.toFixed(4)}
                  </p>
                </div>
              </div>
            </div>

            {/* Recharts Row */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <h3 className="text-base font-bold text-[#cdffb8]">Top 10 Genres in MovieLens</h3>
                <div className="h-72">
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={genreChartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#0e5d04" strokeOpacity={0.4} vertical={false} />
                      <XAxis dataKey="genre" stroke="#40702e" fontSize={11} tickLine={false} />
                      <YAxis stroke="#40702e" fontSize={11} tickLine={false} />
                      <Tooltip 
                        contentStyle={{ backgroundColor: "#050b05", borderColor: "#193d05", color: "#cdffb8", fontFamily: "var(--font-mono)", borderRadius: "0.75rem" }} 
                        itemStyle={{ color: "#77c940" }}
                      />
                      <Bar dataKey="count" fill="url(#greenGradient)" radius={[6, 6, 0, 0]} />
                      <defs>
                        <linearGradient id="greenGradient" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#77c940" stopOpacity={0.9}/>
                          <stop offset="95%" stopColor="#0e5d04" stopOpacity={0.3}/>
                        </linearGradient>
                      </defs>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <h3 className="text-base font-bold text-[#cdffb8]">Global Ratings Frequencies Histogram</h3>
                <div className="h-72">
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={ratingChartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke="#0e5d04" strokeOpacity={0.4} vertical={false} />
                      <XAxis dataKey="rating" stroke="#40702e" fontSize={11} tickLine={false} />
                      <YAxis stroke="#40702e" fontSize={11} tickLine={false} />
                      <Tooltip 
                        contentStyle={{ backgroundColor: "#050b05", borderColor: "#193d05", color: "#cdffb8", fontFamily: "var(--font-mono)", borderRadius: "0.75rem" }} 
                        itemStyle={{ color: "#68df07" }}
                      />
                      <Bar dataKey="count" fill="url(#limeGradient)" radius={[6, 6, 0, 0]} />
                      <defs>
                        <linearGradient id="limeGradient" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#68df07" stopOpacity={0.9}/>
                          <stop offset="95%" stopColor="#1e5809" stopOpacity={0.3}/>
                        </linearGradient>
                      </defs>
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              </div>
            </div>

            {/* Scatter */}
            <div className="glass-panel p-6 rounded-2xl space-y-5">
              <div>
                <h3 className="text-base font-bold text-[#cdffb8] flex items-center gap-2">
                  <span className="text-[#77c940] font-bold mr-1 flex items-center gap-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/><path d="M12 2v20"/><path d="M2 12h20"/></svg>
                  </span>
                  Ratings vs. Vote Counts Distribution
                </h3>
                <p className="text-xs text-muted-foreground mt-1">
                  Average rating vs. number of votes for movies in the catalog.
                  {recommendations && (
                    <span className="text-[#77c940] font-bold ml-1">
                      Your recommendations are highlighted in green.
                    </span>
                  )}
                </p>
              </div>

              <div className="h-96">
                <ResponsiveContainer width="100%" height="100%">
                  <ScatterChart margin={{ top: 20, right: 20, bottom: 20, left: -10 }}>
                    <CartesianGrid stroke="#0e5d04" strokeOpacity={0.3} />
                    <XAxis 
                      type="number" 
                      dataKey="avg_rating" 
                      name="avg_rating" 
                      domain={[0.5, 5.0]} 
                      stroke="#40702e" 
                      fontSize={10} 
                      tickLine={false}
                    >
                      <Label value="Average Rating (R)" offset={-10} position="insideBottom" stroke="#778d7e" fontSize={11} />
                    </XAxis>
                    <YAxis 
                      type="number" 
                      dataKey="vote_count" 
                      name="vote_count" 
                      stroke="#40702e" 
                      fontSize={10} 
                      tickLine={false}
                    >
                      <Label value="Vote Count (v)" angle={-90} position="insideLeft" style={{ textAnchor: 'middle' }} stroke="#778d7e" fontSize={11} />
                    </YAxis>
                    <ZAxis type="number" dataKey="size" range={[20, 150]} />
                    <Tooltip content={<CustomScatterTooltip />} />
                    
                    <Scatter 
                      name="Catalog Catalog" 
                      data={catalogScatter} 
                      fill="#1e5809" 
                      fillOpacity={0.4} 
                    />
                    
                    {recommendedScatter.length > 0 && (
                      <Scatter 
                        name="Your Recommendations" 
                        data={recommendedScatter} 
                        fill="#77c940" 
                        stroke="#68df07" 
                        strokeWidth={2} 
                        fillOpacity={0.95} 
                      />
                    )}
                  </ScatterChart>
                </ResponsiveContainer>
              </div>
            </div>

            {/* Explanation */}
            <div className="glass-panel p-6 rounded-2xl bg-[#091f00]/40 border border-[#193d05] space-y-4">
              <h3 className="text-base font-bold text-[#cdffb8] flex items-center gap-2">
                <ShieldQuestionIcon /> Explaining the Analytical Pipeline
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm text-slate-300 leading-relaxed">
                <div className="space-y-3">
                  <h4 className="font-bold text-slate-200">1. TF-IDF Genre Vectorization</h4>
                  <p>
                    Rather than matching genres as arbitrary labels, the recommender fits a Term Frequency-Inverse Document Frequency (TF-IDF) vectorizer. 
                    Genres that are rare across the dataset (e.g. <i>Film-Noir</i>, <i>IMAX</i>) carry higher weighting. 
                    The user profile builds a matching vector (giving primary genres weight 1.0, secondary mood genres 0.5) and projects it into the shared TF-IDF space. 
                    Cosine similarity is then calculated to score matching features.
                  </p>
                </div>
                
                <div className="space-y-3">
                  <h4 className="font-bold text-slate-200">2. Bayesian Quality Smoothing</h4>
                  <p>
                    Simple average ratings are highly volatile for movies with low vote counts. 
                    We calculate an <b>IMDB Weighted Rating (WR)</b>, which acts as a Bayesian average. 
                    The minimum vote cutoff <code className="text-indigo-400 font-mono">m</code> is calculated dynamically based on your slider selection (percentiles 30% to 90%). 
                    This rating is min-max normalized across candidates, and combined with genre matching using a 60/40 blend.
                  </p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ----------------------------------------------------
      // Component: App
      // ----------------------------------------------------
      function App() {
        const [activeTab, setActiveTab] = React.useState("quiz");
        const [recommendations, setRecommendations] = React.useState(null);
        const [queryParams, setQueryParams] = React.useState(null);
        const [isLoading, setIsLoading] = React.useState(false);
        const [error, setError] = React.useState("");

        const handleQuizSubmit = async (params) => {
          setIsLoading(true);
          setError("");
          setQueryParams(params);
          console.log('[PopcornStats] Submitting quiz with params:', JSON.stringify(params));

          try {
            const data = await api.getRecommendations(params);
            console.log('[PopcornStats] API response received:', {
              keys: Object.keys(data),
              numResults: data.results ? data.results.length : 'NO_RESULTS_KEY',
              C_used: data.C_used,
              m_param_used: data.m_param_used,
              percentile_used: data.percentile_used,
              era_relaxed: data.era_relaxed
            });
            // Validate response structure before setting state
            if (!data || typeof data !== 'object') {
              throw new Error('API returned invalid data: ' + typeof data);
            }
            if (!Array.isArray(data.results)) {
              throw new Error('API response missing results array. Keys: ' + Object.keys(data).join(', '));
            }
            setRecommendations(data);
            setActiveTab("feed");
          } catch (err) {
            console.error('[PopcornStats] Error:', err);
            setError("Recommendation generation failed: " + (err.message || "Ensure backend server is online."));
          } finally {
            setIsLoading(false);
          }
        };

        const handleReset = () => {
          setRecommendations(null);
          setQueryParams(null);
          setActiveTab("quiz");
        };

        return (
          <div className="min-h-screen bg-black text-[#cdffb8] flex flex-col font-sans transition-colors duration-300">
            <header className="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-[#081802]">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3 cursor-pointer" onClick={handleReset}>
                  <div className="w-9 h-9 rounded-xl bg-[#050b05] border border-[#193d05] flex items-center justify-center text-[#77c940]">
                    <FilmIcon />
                  </div>
                  <div>
                    <h1 className="text-lg font-black tracking-tight text-white flex items-center gap-1.5 font-sans">
                      PopcornStats
                    </h1>
                    <p className="text-[10px] text-[#778d7e] font-medium">Explainable Recommendation Engine</p>
                  </div>
                </div>

                <nav className="flex items-center gap-2">
                  <button
                    onClick={() => {
                      if (recommendations) {
                        setActiveTab("feed");
                      } else {
                        setActiveTab("quiz");
                      }
                    }}
                    className={`px-4 py-2 rounded-2xl text-sm font-semibold transition-all duration-200 flex items-center justify-center ${
                      activeTab === "quiz" || activeTab === "feed"
                        ? "bg-[#0c1f08] text-[#a5d98d] border border-[#1f4a13]"
                        : "text-[#7c9081] hover:text-[#cdffb8]"
                    }`}
                  >
                    Recommender
                  </button>
                  
                  <button
                    onClick={() => setActiveTab("insights")}
                    className={`px-4 py-2 rounded-2xl text-sm font-semibold transition-all duration-200 flex items-center justify-center ${
                      activeTab === "insights"
                        ? "bg-[#0c1f08] text-[#a5d98d] border border-[#1f4a13]"
                        : "text-[#7c9081] hover:text-[#cdffb8]"
                    }`}
                  >
                    Insights
                  </button>
                </nav>
              </div>
            </header>

            <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
              {error && (
                <div className="glass-panel border-red-500/30 bg-red-950/20 text-red-300 p-4 rounded-xl flex items-center gap-3 mb-6">
                  <AlertCircleIcon />
                  <span className="text-sm font-semibold">{error}</span>
                </div>
              )}

              {activeTab === "quiz" && (
                <GenreQuiz onSubmit={handleQuizSubmit} isLoading={isLoading} />
              )}
              
              {activeTab === "feed" && recommendations && (
                <RecommendationFeed 
                  recommendations={recommendations} 
                  queryParams={queryParams} 
                  onReset={handleReset} 
                />
              )}
              
              {activeTab === "insights" && (
                <InsightsDashboard recommendations={recommendations} />
              )}
            </main>

            <footer className="bg-slate-950/80 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
              <div className="max-w-7xl mx-auto px-4 space-y-2">
                <p>
                  PopcornStats is an educational data-analysis portfolio demonstration.
                </p>
                <p>
                  Data sourced from <a href="https://grouplens.org/datasets/movielens/" target="_blank" rel="noreferrer" className="text-slate-400 hover:underline">MovieLens</a> & optional poster metadata via <a href="https://themoviedb.org" target="_blank" rel="noreferrer" className="text-slate-400 hover:underline">TMDB API</a>.
                </p>
              </div>
            </footer>
          </div>
        );
      }

      // Error Boundary to catch and display render crashes
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, error: null, errorInfo: null };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, error };
        }
        componentDidCatch(error, errorInfo) {
          console.error("React ErrorBoundary caught:", error, errorInfo);
          this.setState({ errorInfo });
        }
        render() {
          if (this.state.hasError) {
            return (
              <div style={{padding:'40px',fontFamily:'monospace',color:'#ff6b6b',backgroundColor:'#1a1a2e',minHeight:'100vh'}}>
                <h1 style={{fontSize:'24px',marginBottom:'16px'}}>⚠️ React Render Error</h1>
                <pre style={{whiteSpace:'pre-wrap',wordBreak:'break-word',color:'#ffa07a',fontSize:'14px'}}>
                  {this.state.error && this.state.error.toString()}
                </pre>
                <h2 style={{fontSize:'18px',marginTop:'24px',color:'#74b9ff'}}>Component Stack:</h2>
                <pre style={{whiteSpace:'pre-wrap',wordBreak:'break-word',color:'#a29bfe',fontSize:'12px'}}>
                  {this.state.errorInfo && this.state.errorInfo.componentStack}
                </pre>
              </div>
            );
          }
          return this.props.children;
        }
      }

      // Render the App component
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
